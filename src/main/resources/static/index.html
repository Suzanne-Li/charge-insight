   let actions=el('div','admin-actions'),saveButton=el('button','','保存'),resetButton=el('button','','重置密码');actions.append(saveButton,resetButton);actionCell.append(actions);

  })
 }catch(error){alert(error.message==='操作失败'?'当前账号没有系统管理权限。':error.message)}

document.addEventListener('click',e=>{let menu=$('accountMenu');if(!menu.contains(e.target)&&e.target!==$('account'))menu.classList.add('hidden')});

function queryTemplate(tool){
 if(tool==='queryOperationOverview')return 'WITH daily AS (\n  SELECT stat_date, SUM(available_pile_count) AS available_pile_count,\n         SUM(energy_kwh) AS energy_kwh, SUM(gmv_amount) AS gmv_amount\n  FROM v_daily_group_operation\n  WHERE region_name = ? AND stat_date BETWEEN ? AND ?\n  GROUP BY stat_date\n)\nSELECT MAX(stat_date) AS snapshot_date,\n       (取最后数据日 available_pile_count) AS available_pile_count,\n       SUM(energy_kwh), SUM(gmv_amount)\nFROM daily';
 if(tool==='rankGroups')return 'SELECT group_name, SUM(gmv_amount), AVG(offline_pile_count / total_pile_count)\nFROM v_daily_group_operation\nWHERE region_name = ? AND stat_date BETWEEN ? AND ?\nGROUP BY group_id, group_name\nORDER BY 匹配指标\nLIMIT 5';
 if(tool==='rankFaultGroups')return 'SELECT group_name, SUM(fault_pile_count), SUM(fault_duration_minutes)\nFROM v_daily_fault_analysis\nWHERE region_name = ? AND stat_date BETWEEN ? AND ? AND fault_code = ?\nGROUP BY group_id, group_name\nORDER BY SUM(fault_pile_count) DESC\nLIMIT 5';
 if(tool==='queryOperationTrend')return 'SELECT stat_date, SUM(匹配指标) AS metric_value\nFROM v_daily_group_operation\nWHERE region_name = ? AND group_name = ? AND stat_date BETWEEN ? AND ?\nGROUP BY stat_date ORDER BY stat_date';
 if(tool==='queryFaultBreakdown')return 'SELECT fault_type, fault_code, SUM(fault_pile_count), SUM(fault_duration_minutes)\nFROM v_daily_fault_analysis\nWHERE region_name = ? AND group_name = ? AND stat_date BETWEEN ? AND ?\nGROUP BY fault_type, fault_code\nORDER BY SUM(fault_duration_minutes) DESC LIMIT 10';
 return '该步骤使用系统预定义的运营查询。';
}
function appendAudit(details,title,content,open=false){let item=el('details','audit-step');item.open=open;item.append(el('summary','',title),el('pre','',content));details.append(item)}
function card(d,m){let c=el('section','result-card');c.append(el('h3','',d.dataset?.title||'分析结果'));if(d.dataset?.fields?.length&&d.dataset?.rows?.length){let wrap=el('div','table-scroll'),table=el('table','answer-table'),head=document.createElement('thead'),hr=document.createElement('tr');d.dataset.fields.forEach(f=>hr.append(el('th','',`${f.label}${f.unit?`（${f.unit}）`:''}`)));head.append(hr);table.append(head);let body=document.createElement('tbody');d.dataset.rows.slice(0,100).forEach(row=>{let tr=document.createElement('tr');d.dataset.fields.forEach(f=>tr.append(el('td','',safe(row[f.key]))));body.append(tr)});table.append(body);wrap.append(table);c.append(wrap)}let meta=el('div','result-meta'),duration=(d.toolExecution?.toolAudits||[]).reduce((n,x)=>n+(x.durationMs||0),0),time=el('span','answer-time',new Date(d.completedAt||Date.now()).toLocaleString('zh-CN',{hour12:false}));meta.append(el('span','',`查询耗时：${duration} ms`));let detail=el('button','link-btn','执行详情');detail.onclick=()=>drawer(d,m);meta.append(detail,time);c.append(meta);appendFollowups(c,d);return c}
function drawer(d,m){let c=$('drawerContent');c.innerHTML='';let overview=el('section','drawer-section');overview.append(el('h3','', '本次分析'),el('p','',`问题：${m.question}\n统计范围：${d.plan?.scope?.region||'全部区域'} · ${d.plan?.scope?.timeRange||'已解析时间范围'}\n分析类型：${d.plan?.intent||'运营分析'}\nTrace：${safe(d.traceId)}`));c.append(overview);let details=el('section','drawer-section');details.append(el('h3','', '执行详情'));appendAudit(details,'1. 匹配指标与口径',(d.plan?.metrics||[]).map(x=>`• ${x}`).join('\n')||'未匹配到单独指标',true);let sources=d.knowledgeSources||[];appendAudit(details,'2. 匹配 SQL 示例',sources.filter(x=>x.includes('sql-examples')).join('\n')||'本次使用预定义领域查询，无需自由 SQL 示例');let views=[...new Set((d.toolExecution?.toolAudits||[]).flatMap(a=>a.parameters?.views||[]))];if(!views.length)views=(d.toolExecution?.invokedTools||[]).some(x=>x.toLowerCase().includes('fault'))?['v_daily_fault_analysis']:['v_daily_group_operation'];appendAudit(details,'3. 匹配数据表（Schema）',views.join('\n'));appendAudit(details,'4. 生成分析计划',(d.plan?.steps||[]).map((x,i)=>`${i+1}. ${x}`).join('\n')||'按问题范围执行运营查询');(d.toolExecution?.toolAudits||[]).forEach((audit,index)=>{let sql=audit.parameters?.sql||queryTemplate(audit.toolName);appendAudit(details,`${5+index}. ${audit.parameters?.sql?'生成并执行 SQL':'执行查询'} · ${audit.durationMs} ms`,`SQL：\n${sql}\n\n查询参数：\n${JSON.stringify(audit.parameters,null,2)}\n\n执行结果：${audit.resultSummary}`)});appendAudit(details,`${5+(d.toolExecution?.toolAudits||[]).length}. 检查并生成回答`,`返回 ${d.dataset?.rows?.length||0} 条数据；已检查必需字段、空结果和异常数值。`);c.append(details);$('drawer').classList.add('open')}
auth();

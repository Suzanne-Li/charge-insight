spring:
  application:
    name: charge-insight-backend
  datasource:
    url: ${CHARGE_DB_URL:jdbc:mysql://localhost:3306/charging_analytics?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${CHARGE_DB_USERNAME:charge_writer}
    password: ${CHARGE_DB_PASSWORD:local_writer_password_change_me}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: never
  jdbc:
    template:
      query-timeout: ${CHARGE_QUERY_TIMEOUT_SECONDS:5}
  data:
    redis:
      host: ${CHARGE_REDIS_HOST:localhost}
      port: ${CHARGE_REDIS_PORT:6379}
      timeout: ${CHARGE_REDIS_TIMEOUT:1s}
  ai:
    openai:
      # Spring AI appends /v1/chat/completions for the OpenAI-compatible chat API.
      base-url: ${CHARGE_AI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}
      api-key: ${CHARGE_AI_API_KEY:}
      chat:
        options:
          model: ${CHARGE_AI_MODEL:qwen-plus}
          temperature: 0.1
      embedding:
        options:
          model: ${CHARGE_EMBEDDING_MODEL:text-embedding-v4}
    mcp:
      server:
        enabled: ${CHARGE_MCP_ENABLED:false}
        name: chargeinsight-report-export
        version: 0.1.0
        protocol: STATELESS
        type: SYNC
        streamable-http:
          mcp-endpoint: /mcp

server:
  port: ${SERVER_PORT:8080}

charge:
  memory:
    redis-enabled: ${CHARGE_REDIS_ENABLED:false}
    history-limit: ${CHARGE_MEMORY_HISTORY_LIMIT:12}
    ttl-hours: ${CHARGE_MEMORY_TTL_HOURS:24}
    # Earlier messages are compacted only after this count; MySQL remains the full audit source.
    summary-trigger-message-count: ${CHARGE_MEMORY_SUMMARY_TRIGGER_MESSAGE_COUNT:12}
    context-window-message-limit: ${CHARGE_MEMORY_CONTEXT_WINDOW_MESSAGE_LIMIT:8}
  vector:
    # Disabled by default: no embedding request or external vector-store call occurs until explicitly enabled.
    enabled: ${CHARGE_VECTOR_ENABLED:false}
    qdrant:
      base-url: ${CHARGE_QDRANT_BASE_URL:http://localhost:6333}
      collection: ${CHARGE_QDRANT_COLLECTION:chargeinsight_knowledge_v1}
      memory-collection: ${CHARGE_QDRANT_MEMORY_COLLECTION:chargeinsight_memory_v1}
      top-k: ${CHARGE_VECTOR_TOP_K:10}
      embedding-batch-size: ${CHARGE_EMBEDDING_BATCH_SIZE:10}
  sql:
    reader:
      # Dynamic SQL stays disabled until an independently granted SELECT-only identity is configured.
      enabled: ${CHARGE_SQL_READER_ENABLED:false}
      url: ${CHARGE_SQL_READER_URL:}
      username: ${CHARGE_SQL_READER_USERNAME:}
      password: ${CHARGE_SQL_READER_PASSWORD:}
      query-timeout-seconds: ${CHARGE_SQL_READER_QUERY_TIMEOUT_SECONDS:5}
  security:
    # Keep existing local demo calls working until a JWT secret and initial admin password are configured.
    enabled: ${CHARGE_SECURITY_ENABLED:false}
    jwt-secret: ${CHARGE_JWT_SECRET:}
    bootstrap-admin-username: ${CHARGE_BOOTSTRAP_ADMIN_USERNAME:admin}
    bootstrap-admin-password: ${CHARGE_BOOTSTRAP_ADMIN_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
